# Garage-API als Teil des Render-Blueprints.
#
# Diese Datei wird vom Render-Blueprint gelesen (Render erwartet sie im
# Repo-ROOT, auch wenn der Dienst selbst im Unterordner liegt). Der
# bestehende motoroute-api-Dienst bleibt unveraendert - dieser Block
# ergaenzt NUR den Garage-Dienst.
#
# WICHTIG (Lessons aus dem motoroute-api-Blueprint):
#   - Bewusst KEIN envVars:-Block mit sync:false-Eintraegen: Das liess
#     den Blueprint-Sync mit "update_failed" scheitern und die Env-
#     Injection komplett leer bleiben. Die Variablen werden auf
#     Service-Ebene verwaltet (Dashboard -> garage-api -> Environment).
#   - rootDir statt Build in einem Unterverzeichnis: Render liest die
#     Blueprint-Datei aus dem Repo-Root, der Dienst baut aber nur den
#     garage/garage-api-Ordner.
#
# Einmaliges Setup (~5 Minuten, Free Tier, keine Kreditkarte):
#   1. https://dashboard.render.com oeffnen -> Blueprint-Repository
#      "Kjell35/motoroute" auswaehlen. Render zeigt den NEUEN Dienst
#      "garage-api" an (der bestehende motoroute-api bleibt wie er ist)
#      -> "Apply".
#   2. Danach im Dashboard den Dienst "garage-api" oeffnen ->
#      "Environment" und diese Variablen setzen (Werte aus
#      garage/garage-api/.env - lokal vorhanden):
#        DATABASE_URL          = die SUPABASE-POOLER-Verbindung der
#                                Garage-DB (aws-0-eu-central-1.pooler.
#                                supabase.com:5432/postgres)
#        JWT_SECRET            = der 96-Zeichen-Schluessel
#        NODE_ENV              = production
#        CORS_ORIGINS          = *
#        ADMIN_EMAIL / ADMIN_PASSWORD / ADMIN_DISPLAY_NAME
#                                (nur fuer den Seed relevant)
#      -> "Save changes" deployt automatisch neu.
#   3. Ersten Admin anlegen (Einmaljob im Render-Shell-Tab des Dienstes):
#        npm run seed
#      Oder lokal gegen die Cloud-DB:
#        cd garage/garage-api && npm run seed
#   4. Kontrolle: https://garage-api-XXXX.onrender.com/api/health
#      erwartet {"status":"ok","service":"garage-api"}.
#
# Nach dem Live-Gang: GARAGE_API_URL (siehe android-release.yml) auf die
# Render-URL setzen - ab dem naechsten Release-APK ist die Garage-URL
# fest eingebacken, der Endnutzer traegt NICHTS ein.
#
# Free-Tier-Hinweis: Render schlaeft ohne Traffic ein (Kaltstart 30-60 s).
# Der bestaehige Keep-Alive-Workflow pingt nur die MotoRoute-API - fuer
# die Garage spaeter einen zweiten Ping ergaenzen (oder die Garage in
# denselben Workflow mit aufnehmen).

services:
  - type: web
    name: garage-api
    runtime: node
    rootDir: garage/garage-api
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: node dist/src/main.js
    healthCheckPath: /api/health
    autoDeploy: true
