# MotoRoute Backend als Render-Blueprint.
#
# WICHTIG: Dienst über "New + Blueprint" anlegen (nicht "New + Web
# Service") - nur dann liest Render diese Datei mit rootDir
# motoroute_api. Bei "Web Service" auto-erkennt Render sonst den
# POI-Dienst-Ordner und deployt das falsche App.
#
# Falls schon ein falscher Dienst existiert (URL antwortet mit
# {"service":"motoroute-server"} auf /health): Im Dashboard den Dienst
# öffnen und REPARIEREN (Name/URL bleibt):
#   Settings -> Root Directory: motoroute_api
#   Build Command:  npm ci && npm run build
#   Start Command:  node dist/main.js
#   Health Check Path: /v1/health
#   Environment: NODE_ENV=production, AUTH_AUTO_CONFIRM=true,
#                SUPABASE_URL, SUPABASE_ANON_KEY,
#                SUPABASE_SERVICE_ROLE_KEY, TRAFFIC_API_KEY,
#                RIDE_RELAY_SECRET (Werte aus motoroute_api/.env)
#   -> Manual Deploy. Danach antwortet /v1/health mit {"status":"ok"}.
#
# Einmaliges Setup (2 Minuten, Free Tier, keine Kreditkarte noetig):
#   1. https://dashboard.render.com/select-repo?type=blueprint oeffnen
#   2. GitHub-Repo "Kjell35/motoroute" verbinden
#   3. Render liest diese Datei und fragt die sync:false-Variablen ab -
#      die Werte stehen in der lokalen motoroute_api/.env (kopieren und
#      einfuegen). Danach ist das Backend dauerhaft online unter
#      https://motoroute-api.onrender.com - die App hat die URL fest
#      eingebaut, der Endnutzer traegt GAR NICHTS ein.
#
# Bewusst NICHT gesetzt:
#   - GRAPHHOPPER_URL: Auf dem Free Tier laeuft keine lokale Java-
#     Routing-Instanz. Der Routing-Client faellt automatisch auf den
#     OSRM-Fallback zurueck (Auto-Profil, Kurven-Praeferenzen entfallen
#     dort - siehe graphhopper.client.ts). Spaeter einfach ergaenzen,
#     wenn ein GraphHopper-Cloud-Key oder eigener Server existiert.
#   - OPENWEATHER_API_KEY / OVERPASS_URL / BIKER_POI_SERVICE_URL:
#     optionale Features (Wetter laeuft ab Werk keyless ueber Open-Meteo).

# BEWUSST KEIN envVars:-Block mehr: Bei Blueprint-managed Services
# mit sync:false-Eintraegen ohne Werte scheitert der Blueprint-Sync
# (Deploy-Status "update_failed") und die Env-Injection der Laufzeit
# bleibt KOMPLETT leer - selbst Render-eigene RENDER_*-Variablen
# fehlen. Die Variablen werden stattdessen auf Service-Ebene verwaltet
# (Render-Dashboard -> Environment, oder API PUT .../env-vars) - dort
# sind sie gesetzt und werden zuverlaessig injiziert.

services:
  - type: web
    name: motoroute-api
    runtime: node
    rootDir: motoroute_api
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /v1/health
    autoDeploy: true
