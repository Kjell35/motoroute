org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=true

# Build-Cache: Task-Ausgaben (Kotlin/Java-Compile, Ressourcen, Dexing) werden
# wiederverwendet, wenn die Eingaben gleich sind - auch ueber verschiedene
# Checkouts hinweg. Der CI-Cache von setup-java transportiert ~/.gradle/caches
# und damit auch das Build-Cache-Verzeichnis.
org.gradle.caching=true
