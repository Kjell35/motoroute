name: motoroute
description: "MotoRoute – Navigation for motorcyclists: routes by riding fun, not just speed."
publish_to: 'none'
version: 1.0.4+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  maplibre_gl: ^0.21.0
  geolocator: ^12.0.0
  http: ^1.2.0
  flutter_tts: ^4.0.2
  pretty_qr_code: ^3.6.0
  mobile_scanner: ^6.0.11
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map-style/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
