name: MotoRoute Next Android Release

on:
  push:
    tags:
      - 'next-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        # Muss zur Version in apps/motoroute_next/pubspec.yaml passen; der
        # Preflight bricht bei Abweichung ab, statt nur zu warnen.
        description: Release tag (next-vX.Y.Z) - must match the app version
        required: true
        default: next-v1.0.0

# Standard fuer alle Jobs: nur Lesen. Schreibrecht auf Contents braucht nur
# der Build-Job (Release anlegen, Assets anhaengen) und holt es sich dort.
permissions:
  contents: read

# Zwei Laeufe auf denselben Tag wuerden dieselben Release-Assets schreiben -
# der zuletzt fertige gewinnt, auch wenn er der aeltere Build ist. Die Gruppe
# haengt deshalb am Tag, nicht am Ref: ein Tag-Push (refs/tags/next-v1.0.2)
# und ein workflow_dispatch auf denselben Tag (refs/heads/monorepo) landen in
# derselben Gruppe und laufen nacheinander. Abbrechen waere hier falsch - ein
# laufender Release soll zu Ende laufen, der neue wartet.
concurrency:
  group: next-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Laeuft zuerst: ein falsch getaggter Release soll in Sekunden auffallen,
  # nicht erst nach dem Android-Build. Braucht kein Android-SDK, nur Git und
  # die pubspec.
  preflight:
    name: Preflight (Tag, versionName, Build-Nummer)
    runs-on: ubuntu-latest
    # Die geprueften Werte gehen an build-and-release; dort prueft der
    # Artefakt-Check die gebauten APKs gegen denselben Sollwert.
    outputs:
      expected_version: ${{ steps.preflight.outputs.version }}
      base_code: ${{ steps.preflight.outputs.build_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight (Tag, versionName, Build-Nummer)
        id: preflight
        working-directory: apps/motoroute_next
        env:
          # Bei workflow_dispatch entsteht der Release unter genau diesem Tag
          # (tag_name im Publish-Schritt) - er wird deshalb wie ein gepushter
          # Tag geprueft und nicht nur als Warnung behandelt.
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        # Derselbe Code laeuft im CI-Workflow (dort nicht-streng): eine Kopie
        # waere nach der naechsten Aenderung an einer Stelle veraltet.
        run: bash "$GITHUB_WORKSPACE/scripts/next-preflight.sh"
  build-and-release:
    name: Build and publish Android APK
    needs: preflight
    runs-on: ubuntu-latest
    # Ohne Timeout haengt ein blockierter Gradle- oder Flutter-Schritt bis zu
    # sechs Stunden auf dem Runner - und blockiert wegen der concurrency-Gruppe
    # jeden weiteren Release auf denselben Tag. Der Build dauert wenige
    # Minuten; 30 Minuten sind Luft fuer einen kalten Cache.
    timeout-minutes: 30
    # Einziger Job mit Schreibrecht: Release anlegen und APKs anhaengen.
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Gleiche feste Version wie im App-Workflow: `channel: stable`
          # haette bei jedem Lauf ein anderes SDK gezogen.
          flutter-version: '3.47.4'

      # The rebuilt Flutter project is nested in the monorepo. Flutter
      # discovers the nearest pubspec only from the current directory.
      - name: Install packages for shared MotoRoute features
        working-directory: apps/mobile
        run: flutter pub get

      - name: Install Flutter packages
        working-directory: apps/motoroute_next
        run: flutter pub get

      - name: Run tests
        working-directory: apps/motoroute_next
        run: flutter test

      - name: Analyze app
        working-directory: apps/motoroute_next
        # Wie im App-Workflow: neuere SDKs melden Deprecations als Info; die
        # duerfen den Release nicht blockieren, echte Errors schon.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Per-ABI-Pakete sind rund ein Drittel so gross wie die Universal-APK:
      # nur eine native Bibliothek pro Geraet statt aller drei.
      - name: Build installable release APKs (per ABI)
        working-directory: apps/motoroute_next
        run: >-
          flutter build apk --release --split-per-abi
          --dart-define=API_BASE_URL=https://motoroute-api-8fi9.onrender.com

      # Was nur am gebauten Artefakt pruefbar ist: ob im Paket wirklich der
      # erwartete versionName steht und ob die empfohlene arm64-Variante dabei
      # ist. Version und Build-Nummer selbst hat der Preflight geprueft.
      - name: APKs tragen die erwartete Version
        working-directory: apps/motoroute_next
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.expected_version }}
          EXPECTED_BUILD_CODE: ${{ needs.preflight.outputs.base_code }}
        run: |
          set -euo pipefail
          # Ohne Sollwerte aus dem Preflight waere dieser Vergleich wirkungslos.
          : "${EXPECTED_VERSION:?Preflight hat keine expected_version geliefert}"
          : "${EXPECTED_BUILD_CODE:?Preflight hat keinen base_code geliefert}"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT2=$(find "$SDK/build-tools" -maxdepth 2 -name aapt2 2>/dev/null | sort -V | tail -n1) || AAPT2=""
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 nicht gefunden unter $SDK/build-tools - versionName waere ungeprueft."
            exit 1
          fi
          ARM64=0
          # Ohne Treffer liefert die for-Schleife sonst das Muster selbst an
          # aapt2 - der Check waere dann still wirkungslos.
          shopt -s nullglob
          APKS=(build/app/outputs/flutter-apk/*.apk)
          shopt -u nullglob
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::keine APKs unter build/app/outputs/flutter-apk/ - der Check waere wirkungslos."
            exit 1
          fi
          for APK in "${APKS[@]}"; do
            BADGING=$("$AAPT2" dump badging "$APK")
            NAME=$(grep -m1 -o "versionName='[^']*'" <<< "$BADGING" | cut -d"'" -f2) || NAME=""
            CODE=$(grep -m1 -o "versionCode='[0-9]*'" <<< "$BADGING" | cut -d"'" -f2) || CODE=""
            if [ -z "$NAME" ] || [ -z "$CODE" ]; then
              echo "::error::$APK: versionName/versionCode nicht lesbar - ohne Sollwert prueft dieser Schritt nichts."
              exit 1
            fi
            if [ "$NAME" != "$EXPECTED_VERSION" ]; then
              echo "::error::$APK meldet versionName '$NAME', erwartet '$EXPECTED_VERSION' (Preflight)."
              exit 1
            fi
            # Die ABI-Splits tragen versionCode + Versatz (1000/2000/4000),
            # deshalb nur die Untergrenze: ein Rest aus einem alten Build hat
            # die Build-Nummer der aktuellen pubspec noch nicht.
            if [ "$CODE" -lt "$EXPECTED_BUILD_CODE" ]; then
              echo "::error::$APK meldet versionCode $CODE, die pubspec verlangt mindestens $EXPECTED_BUILD_CODE - das APK stammt aus einem aelteren Build."
              exit 1
            fi
            case "$APK" in
              *app-arm64-v8a-release.apk) ARM64=1 ;;
            esac
            echo "$APK: versionName $NAME, versionCode $CODE"
          done
          if [ "$ARM64" != "1" ]; then
            echo "::error::app-arm64-v8a-release.apk fehlt - die Variante, die die Release-Anleitung empfiehlt, waere ungeprueft."
            exit 1
          fi

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: MotoRoute Next ${{ inputs.release_tag || github.ref_name }}
          body: |
            Installierbarer Android-Release der neu aufgebauten MotoRoute-App.

            Welche Datei? `arm64-v8a` passt auf praktisch alle Handys ab 2016,
            `armeabi-v7a` ist die Altgeraete-Variante, `x86_64` ist fuer
            Emulatoren gedacht. Jede Datei enthaelt nur die native Bibliothek
            ihrer Architektur und ist damit deutlich kleiner als eine
            Universal-APK.

            Hinweis: Die APK ist für die direkte Installation debug-signiert. Für Updates muss derselbe Signaturschlüssel verwendet werden; vor einer Play-Store-Veröffentlichung ist ein privater Upload-Schlüssel einzurichten.
          files: |
            apps/motoroute_next/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            apps/motoroute_next/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            apps/motoroute_next/build/app/outputs/flutter-apk/app-x86_64-release.apk
          generate_release_notes: true
