name: MotoRoute Next Android Release

on:
  push:
    tags:
      - 'next-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the APK to
        required: true
        default: next-v1.0.0

# Standard fuer alle Jobs: nur Lesen. Schreibrecht auf Contents braucht nur
# der Build-Job (Release anlegen, Assets anhaengen) und holt es sich dort.
permissions:
  contents: read

jobs:
  # Laeuft zuerst: ein falsch getaggter Release soll in Sekunden auffallen,
  # nicht erst nach dem Android-Build. Braucht kein Android-SDK, nur Git und
  # die pubspec.
  preflight:
    name: Preflight (Tag, versionName, Build-Nummer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight (Tag, versionName, Build-Nummer)
        working-directory: apps/motoroute_next
        run: |
          set -euo pipefail
          STRICT=0
          if [[ "$GITHUB_REF" == refs/tags/next-v* ]]; then
            STRICT=1
          fi
          FAILED=0
          report() {
            if [ "$STRICT" = "1" ]; then
              echo "::error::$1"
            else
              echo "::warning::$1 (auf einem Release-Tag bricht der Job hier ab)"
            fi
            FAILED=1
          }
          die() {
            report "$1"
            if [ "$STRICT" = "1" ]; then
              exit 1
            fi
            exit 0
          }
          PUBSPEC_VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -n1)
          if [ -z "$PUBSPEC_VERSION" ]; then
            die "apps/motoroute_next/pubspec.yaml hat keine version-Zeile - der Vergleich waere wirkungslos."
          fi
          if [[ "$PUBSPEC_VERSION" != *+* ]]; then
            die "version in apps/motoroute_next/pubspec.yaml ist '$PUBSPEC_VERSION' - ohne +versionCode keine Monotoniepruefung."
          fi
          BASE_CODE="${PUBSPEC_VERSION#*+}"
          # Sollwert fuer den versionName: der Tag, sonst die Version, die als
          # naechstes getaggt wird.
          EXPECTED="${GITHUB_REF_NAME#next-v}"
          if [ "$STRICT" = "0" ]; then
            EXPECTED="${PUBSPEC_VERSION%%+*}"
          fi
          if [ -z "$EXPECTED" ]; then
            die "versionName-Sollwert nicht bestimmbar - der Vergleich waere wirkungslos."
          fi
          if [ "$STRICT" = "1" ] && [ "${PUBSPEC_VERSION%%+*}" != "$EXPECTED" ]; then
            report "Tag $GITHUB_REF_NAME passt nicht zu apps/motoroute_next/pubspec.yaml ($PUBSPEC_VERSION) - erst bumpen, dann taggen."
          fi
          # Vergleichswert fuer die Build-Nummer: der Vorgaenger-Tag. Nur
          # Git-Tags, kein Zustand zwischen Laeufen; der Checkout ist flach,
          # die Tags werden deshalb nachgeladen.
          if ! git fetch --quiet --depth=1 --force origin 'refs/tags/next-v*:refs/tags/next-v*'; then
            die "Tags liessen sich nicht nachladen - ohne Vorgaenger waere die Build-Nummer ungeprueft."
          fi
          DESC=$(git tag --list 'next-v*' --sort=-v:refname)
          PREV=""
          if [ "$STRICT" = "1" ]; then
            if ! grep -qx "$GITHUB_REF_NAME" <<< "$DESC"; then
              die "Tag $GITHUB_REF_NAME fehlt in der Tag-Liste - Reihenfolge unklar, Build-Nummer waere ungeprueft."
            fi
            # shellcheck disable=SC2016 # awk-Programm, kein Shell-Ausdruck
            PREV=$(awk -v cur="$GITHUB_REF_NAME" '$0 == cur { found = 1; next } found { print; exit }' <<< "$DESC")
          else
            PREV=$(head -n1 <<< "$DESC")
          fi
          if [ -z "$PREV" ]; then
            echo "::warning::Kein vorheriger v*-Tag gefunden - Build-Nummer bleibt ungeprueft (erster Release dieser Art)."
          else
            PREV_VERSION=$(git show "$PREV:apps/motoroute_next/pubspec.yaml" | sed -n 's/^version: *//p' | head -n1)
            if [[ "$PREV_VERSION" != *+* ]]; then
              die "version in $PREV ist '$PREV_VERSION' - ohne +versionCode nicht vergleichbar."
            fi
            PREV_CODE="${PREV_VERSION#*+}"
            echo "vorher ($PREV): Build-Nummer $PREV_CODE - jetzt: $BASE_CODE"
            if [ "$BASE_CODE" -le "$PREV_CODE" ]; then
              report "Build-Nummer $BASE_CODE ist nicht hoeher als bei $PREV ($PREV_CODE) - Android bietet dann kein Update an. Bitte in apps/motoroute_next/pubspec.yaml erhoehen."
            fi
          fi
          if [ "$FAILED" = "1" ]; then
            if [ "$STRICT" = "1" ]; then
              exit 1
            fi
            echo "::notice::Preflight: die Abweichungen oben sind auf einem Branch nur Warnungen - bitte vor dem Taggen beheben."
          fi
          echo "Preflight-Werte: versionName $EXPECTED, Build-Nummer $BASE_CODE"
          echo "Preflight ok: versionName $EXPECTED, Build-Nummer $BASE_CODE (Vorgaenger ${PREV:-keiner})."

  build-and-release:
    name: Build and publish Android APK
    needs: preflight
    runs-on: ubuntu-latest
    # Einziger Job mit Schreibrecht: Release anlegen und APKs anhaengen.
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Gleiche feste Version wie im App-Workflow: `channel: stable`
          # haette bei jedem Lauf ein anderes SDK gezogen.
          flutter-version: '3.47.4'

      # The rebuilt Flutter project is nested in the monorepo. Flutter
      # discovers the nearest pubspec only from the current directory.
      - name: Install packages for shared MotoRoute features
        working-directory: apps/mobile
        run: flutter pub get

      - name: Install Flutter packages
        working-directory: apps/motoroute_next
        run: flutter pub get

      - name: Run tests
        working-directory: apps/motoroute_next
        run: flutter test

      - name: Analyze app
        working-directory: apps/motoroute_next
        # Wie im App-Workflow: neuere SDKs melden Deprecations als Info; die
        # duerfen den Release nicht blockieren, echte Errors schon.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Per-ABI-Pakete sind rund ein Drittel so gross wie die Universal-APK:
      # nur eine native Bibliothek pro Geraet statt aller drei.
      - name: Build installable release APKs (per ABI)
        working-directory: apps/motoroute_next
        run: >-
          flutter build apk --release --split-per-abi
          --dart-define=API_BASE_URL=https://motoroute-api-8fi9.onrender.com

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: MotoRoute Next ${{ inputs.release_tag || github.ref_name }}
          body: |
            Installierbarer Android-Release der neu aufgebauten MotoRoute-App.

            Welche Datei? `arm64-v8a` passt auf praktisch alle Handys ab 2016,
            `armeabi-v7a` ist die Altgeraete-Variante, `x86_64` ist fuer
            Emulatoren gedacht. Jede Datei enthaelt nur die native Bibliothek
            ihrer Architektur und ist damit deutlich kleiner als eine
            Universal-APK.

            Hinweis: Die APK ist für die direkte Installation debug-signiert. Für Updates muss derselbe Signaturschlüssel verwendet werden; vor einer Play-Store-Veröffentlichung ist ein privater Upload-Schlüssel einzurichten.
          files: |
            apps/motoroute_next/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            apps/motoroute_next/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            apps/motoroute_next/build/app/outputs/flutter-apk/app-x86_64-release.apk
          generate_release_notes: true
