# CI-Build: Debug-APK bei jedem Push auf main und für Pull Requests.
#
# Die APK landet als Workflow-Artefakt (Run-Seite → "Artifacts" →
# motoRoute-debug-apk). Sie ist mit dem Android-Debug-Key signiert -
# ideal zum schnellen Testen, NICHT als Grundlage für Updates einer
# installierten Release-App (andere Signatur → Deinstallation nötig,
# siehe docs/INSTALL.md "Debug- vs. Release-Signatur").
#
# Release-Builds (Tag → signierte APK + GitHub Release): android-release.yml

name: android-build

on:
  push:
    branches: [main]
    # Release-Tags haben ihren eigenen Workflow.
    tags-ignore: ['v*']
  pull_request:

jobs:
  build-debug-apk:
    name: Tests + Debug-APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Piniert: Neu erscheinende Stable-Varianten (z. B. 3.47.5)
          # dürfen Builds nicht unvorhersehbar brechen. Upgrade bewusst
          # per Commit (Version hier ändern + Tests beobachten).
          flutter-version: 3.47.4

      - name: Pub-Abhängigkeiten
        working-directory: motoroute_app
        run: flutter pub get

      - name: Statische Analyse (nur Fehler blockieren)
        working-directory: motoroute_app
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Tests
        working-directory: motoroute_app
        run: flutter test 2>&1 | tee test-output.txt
      - name: Test-Fehler oeffentlich sichtbar machen (Issue)
        if: failure()
        working-directory: motoroute_app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -80 test-output.txt > test-failure-tail.txt
          gh issue create \
            --title "CI-Test-Fehler @ ${{ github.sha }}" \
            --body-file test-failure-tail.txt || echo "Issue nicht erstellt"

      - name: Debug-APK bauen
        working-directory: motoroute_app
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://motoroute-api-8fi9.onrender.com --dart-define=CARTO_BASEMAP_KEY=${{ secrets.CARTO_BASEMAP_KEY }} 2>&1 | tee build-output.txt
      - name: Build-Fehler oeffentlich sichtbar machen (Issue)
        if: failure()
        working-directory: motoroute_app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -80 build-output.txt > build-failure-tail.txt
          gh issue create \
            --title "CI-Build-Fehler @ ${{ github.sha }}" \
            --body-file build-failure-tail.txt || echo "Issue nicht erstellt"

      - name: APK-Größe im Log
        working-directory: motoroute_app
        run: ls -lh build/app/outputs/flutter-apk/ || find . -name "app-debug.apk" -exec ls -lh {} \;

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: motoRoute-debug-apk
          path: motoroute_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
