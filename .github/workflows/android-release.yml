name: Android Build & Release

on:
  push:
    # Gepusht wird nach `monorepo`. `main` ist die alte Struktur ohne apps/
    # und wuerde jeden Job am working-directory scheitern lassen.
    branches: [monorepo]
    tags: ['v*']
  pull_request:
    # PRs laufen gegen den Branch, in dem die App liegt - nicht gegen das
    # Legacy-`main`. Feature-Branches loesen dadurch keinen zusaetzlichen
    # push-Lauf aus.
    branches: [monorepo]
  workflow_dispatch:

# Zwei schnelle Pushes auf denselben Ref sollen nicht parallel bauen.
# Tag-Laeufe werden nie abgebrochen: dort haengen Uploads am selben Lauf.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Tag-Release braucht Schreibrecht auf Contents (v-Release erstellen/anhängen).
permissions:
  contents: write

jobs:
  # Laeuft zuerst: ein Fehler im Workflow selbst (Syntax, Ausdruck, Step-ID
  # oder run-Skript) soll in ~20 s auffallen statt erst, wenn ein
  # 10-Minuten-Android-Build daran scheitert - und erst recht nicht erst bei
  # einem Release-Tag.
  lint:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    # Nur Lesen: dieser Job baut nichts und schreibt nichts.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Prueft Syntax, ${{ }}-Ausdruecke, Step- und Job-Referenzen und per
      # shellcheck auch die run-Skripte. actionlint-Version gepinnt, damit ein
      # neues Release einen gruenen Workflow nicht nachtraeglich rot macht.
      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          version: '1.7.12'
          cache: true

  test:
    name: Tests (Flutter)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          # Feste Version: `channel: stable` haette bei jedem Lauf ein anderes
          # SDK gezogen - zusammen mit dem eingecheckten pubspec.lock baut
          # derselbe Commit dann wirklich dasselbe APK.
          flutter-version: '3.47.4'
          # SDK aus dem Actions-Cache: der Key haengt an der festen Version,
          # ein fremdes SDK kann also nicht aus dem Cache kommen. Spart pro
          # Job rund eine Minute Setup.
          cache: true

      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        # Info-/Warning-Meldungen blockieren den Build nicht; echte Errors
        # führen weiterhin zu exit != 0 → Job fällt.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        working-directory: apps/mobile
        run: flutter test

  build-apk:
    name: Release-APKs (installierbar)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Java 21 (flutter_keychain 3.0.1 target)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          # SDK aus dem Actions-Cache: der Key haengt an der festen Version,
          # ein fremdes SDK kann also nicht aus dem Cache kommen. Spart pro
          # Job rund eine Minute Setup.
          cache: true

      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get

      # Release-Signatur: Ohne echten Keystore bekommt jede APK den
      # Zufalls-Debug-Schlüssel des jeweiligen Runners - Updates über eine
      # bestehende Installation scheitern dann an der Signatur.
      - name: Signaturschlüssel bereitstellen
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.MOTOROUTE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOTOROUTE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOTOROUTE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOTOROUTE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::MOTOROUTE_KEYSTORE_B64 fehlt - ein Release waere nur debug-signiert und nicht update-faehig."
              exit 1
            fi
            echo "::warning::Kein Release-Keystore hinterlegt - dieser Build ist nur debug-signiert (kein Release-Tag)."
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/motoroute-release.jks"
          mkdir -p "$(dirname "$KEYSTORE")"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          # Früh und eindeutig scheitern, wenn Keystore, Passwort und Alias
          # nicht zusammenpassen - sonst bricht erst Gradle mit kryptischem
          # Fehler ab. Passwort über die Umgebung, nicht über argv.
          if ! PW="$KEYSTORE_PASSWORD" keytool -list -keystore "$KEYSTORE" -storepass:env PW -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::Keystore, Passwort oder Alias aus den Secrets passen nicht zusammen."
            exit 1
          fi
          {
            echo "MOTOROUTE_KEYSTORE_PATH=$KEYSTORE"
            echo "MOTOROUTE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MOTOROUTE_KEY_ALIAS=$KEY_ALIAS"
            echo "MOTOROUTE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APKs (release, signiert)
        working-directory: apps/mobile
        env:
          # Haupt-API (Login, Profile, Chat usw.) der wiederhergestellten App.
          # MOTOROUTE_API_BASE_URL bleibt separat für das neue Pairing-Backend.
          API_BASE_URL: https://motoroute-api-8fi9.onrender.com
          MOTOROUTE_API_BASE_URL: ${{ vars.MOTOROUTE_API_BASE_URL || 'https://motoroute.example' }}
        run: |
          set -o pipefail
          rm -rf dist && mkdir -p dist
          # 1) Universal-APK (alle ABIs, ~110 MB) als Fallback. Sie bekommt
          #    bewusst denselben versionCode wie das arm64-Paket (+2000):
          #    Android vergleicht nur ihn, mit Offset 0 waere der Wechsel
          #    von arm64 auf die Universal-APK ein Downgrade und scheitert
          #    mit "App nicht installiert".
          BASE_CODE=$(sed -n 's/^version: *//p' pubspec.yaml | sed -n 's/.*+\([0-9]*\)$/\1/p' | head -n1)
          if [ -z "$BASE_CODE" ]; then
            echo "::error::apps/mobile/pubspec.yaml hat keine Build-Nummer (+N) - die Universal-APK bekaeme sonst einen zu niedrigen versionCode."
            exit 1
          fi
          UNIVERSAL_CODE=$((BASE_CODE + 2000))
          flutter build apk --release --build-number "$UNIVERSAL_CODE" \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="MOTOROUTE_API_BASE_URL=$MOTOROUTE_API_BASE_URL" 2>&1 \
            | tee build-release.log
          cp build/app/outputs/flutter-apk/app-release.apk dist/
          # 2) Eine APK pro ABI (~40 MB): arm64 deckt aktuelle Geraete ab,
          #    armeabi-v7a aeltere, x86_64 Emulator/Chromebook. Der Glob
          #    haelt die ABI-Liste aus dem Workflow heraus.
          flutter build apk --release --split-per-abi \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="MOTOROUTE_API_BASE_URL=$MOTOROUTE_API_BASE_URL" 2>&1 \
            | tee -a build-release.log
          cp build/app/outputs/flutter-apk/app-*-release.apk dist/
          # shellcheck disable=SC2012 # Ausgabe fuer Menschen, kein Parsing
          ls -lh dist

      # R8 ist aktiv (isMinifyEnabled/isShrinkResources in build.gradle.kts):
      # ohne mapping.txt waere jeder Stacktrace aus einem ausgelieferten Build
      # unlesbar - und zwar genau dann, wenn Fehlerberichte eintreffen.
      - name: R8-Mapping prüfen
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          MAPPING=build/app/outputs/mapping/release/mapping.txt
          if [ ! -s "$MAPPING" ]; then
            echo "::error::$MAPPING fehlt oder ist leer - Stacktraces der Release-APKs waeren nicht lesbar."
            exit 1
          fi
          echo "$MAPPING: $(wc -l < "$MAPPING") Zeilen, $(wc -c < "$MAPPING") Bytes"

      # 90 Tage statt der 7 der APKs: Fehlerberichte kommen spaeter. Der Name
      # enthaelt den Ref, damit Tag- und Branch-Laeufe nicht kollidieren.
      - name: R8-Mapping als Artifact
        uses: actions/upload-artifact@v4
        with:
          name: motoroute-mapping-${{ github.ref_name }}
          path: apps/mobile/build/app/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: error

      - name: Produktions-API erreichbar
        env:
          API_BASE_URL: https://motoroute-api-8fi9.onrender.com
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 "$API_BASE_URL/v1/health"

      - name: APKs enthalten Produktions-API
        working-directory: apps/mobile
        run: |
          for APK in dist/*.apk; do
            strings "$APK" | grep -Fq 'https://motoroute-api-8fi9.onrender.com' || {
              echo "Release-APK $APK enthält nicht die erwartete Produktions-API-URL." >&2
              exit 1
            }
          done

      # Tag und versionCode sind zwei Aussagen derselben badging-Metadaten.
      # Auf einem v*-Tag bricht die() bei Abweichungen ab; auf Branch-Pushes
      # sammelt report() sie als Warnung - so faellt ein falscher versionCode
      # vor dem Taggen auf statt erst, wenn der Tag schon existiert.
      - name: Tag, versionName und versionCode passen (Warnung auf Branches)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          STRICT=0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            STRICT=1
          fi
          FAILED=0
          report() {
            if [ "$STRICT" = "1" ]; then
              echo "::error::$1"
            else
              echo "::warning::$1 (auf einem Release-Tag bricht der Job hier ab)"
            fi
            FAILED=1
          }
          # Harte Voraussetzung: ohne diese Werte prueft der Schritt nichts.
          die() {
            report "$1"
            if [ "$STRICT" = "1" ]; then
              exit 1
            fi
            exit 0
          }
          PUBSPEC_VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -n1)
          # Sollwert fuer den versionName: der Tag, sonst die Version, die als
          # naechstes getaggt wird.
          EXPECTED="${GITHUB_REF_NAME#v}"
          if [ "$STRICT" = "0" ]; then
            EXPECTED="${PUBSPEC_VERSION%%+*}"
          fi
          if [ -z "$EXPECTED" ]; then
            die "versionName-Sollwert nicht bestimmbar - der Vergleich waere wirkungslos."
          fi
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT2=$(find "$SDK/build-tools" -maxdepth 2 -name aapt2 | sort -V | tail -n1)
          if [ -z "$AAPT2" ]; then
            die "aapt2 nicht gefunden unter $SDK/build-tools - Version und versionCode waeren ungeprueft."
          fi
          # Vergleichswert fuer den versionCode: auf einem Tag der Vorgaenger,
          # auf einem Branch der letzte Release. Nur Git-Tags, kein Zustand
          # zwischen Laeufen; der Checkout ist flach, Tags werden nachgeladen.
          if ! git fetch --quiet --depth=1 --force origin 'refs/tags/v*:refs/tags/v*'; then
            die "Tags liessen sich nicht nachladen - ohne Vorgaenger waere der versionCode ungeprueft."
          fi
          DESC=$(git tag --list 'v*' --sort=-v:refname)
          if [ "$STRICT" = "1" ]; then
            if ! printf '%s\n' "$DESC" | grep -qx "$GITHUB_REF_NAME"; then
              die "Tag $GITHUB_REF_NAME fehlt in der Tag-Liste - Reihenfolge unklar, versionCode waere ungeprueft."
            fi
            # shellcheck disable=SC2016 # awk-Programm, kein Shell-Ausdruck
            PREV=$(printf '%s\n' "$DESC" | awk -v cur="$GITHUB_REF_NAME" '
              $0 == cur { found = 1; next }
              found { print; exit }')
          else
            PREV=$(printf '%s\n' "$DESC" | head -n1)
          fi
          PREV_CODE=""
          if [ -z "$PREV" ]; then
            echo "::warning::Kein vorheriger v*-Tag gefunden - versionCode bleibt ungeprueft (erster Release dieser Art)."
          else
            PREV_VERSION=$(git show "$PREV:apps/mobile/pubspec.yaml" | sed -n 's/^version: *//p' | head -n1)
            if [[ "$PREV_VERSION" != *+* ]]; then
              die "version in $PREV ist '$PREV_VERSION' - ohne +versionCode nicht vergleichbar."
            fi
            PREV_CODE="${PREV_VERSION#*+}"
          fi
          # aapt2 liefert beide Werte in einem Aufruf pro APK:
          #   package: name='de.motoroute.app' versionCode='2051' versionName='1.0.15' ...
          UNIVERSAL_CODE=""; ARM64_CODE=""
          for APK in dist/*.apk; do
            BADGING=$("$AAPT2" dump badging "$APK")
            NAME=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)
            CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)
            if [ -z "$NAME" ] || [ -z "$CODE" ]; then
              die "$APK: versionName/versionCode nicht lesbar - ohne Sollwert prueft dieser Schritt nichts."
            fi
            if [ "$NAME" != "$EXPECTED" ]; then
              report "$APK meldet versionName '$NAME', erwartet '$EXPECTED' (Tag bzw. pubspec.yaml). Erst apps/mobile/pubspec.yaml bumpen, dann taggen."
              continue
            fi
            case "$APK" in
              dist/app-release.apk) UNIVERSAL_CODE="$CODE" ;;
              dist/app-arm64-v8a-release.apk) ARM64_CODE="$CODE" ;;
            esac
            echo "$APK: versionName $NAME, versionCode $CODE"
          done
          if [ -z "$UNIVERSAL_CODE" ] || [ -z "$ARM64_CODE" ]; then
            die "Universal-APK oder arm64-APK fehlt in dist/ - der Update-Pfad waere ungeprueft."
          fi
          # Android vergleicht nur den versionCode: Universal und arm64 muessen
          # denselben tragen, sonst waere der Wechsel zum Fallback ein Downgrade.
          if [ "$UNIVERSAL_CODE" -ne "$ARM64_CODE" ]; then
            report "Universal-APK hat versionCode $UNIVERSAL_CODE, arm64-APK $ARM64_CODE - ein Wechsel zwischen beiden waere ein Downgrade. Der Build-Schritt setzt --build-number auf Build-Nummer + 2000."
          fi
          # Monotonie: der +2000-Offset gilt auf beiden Seiten, die Build-Nummer
          # laesst sich also 1:1 mit dem Vorgaenger-Tag vergleichen.
          if [[ "$PUBSPEC_VERSION" != *+* ]]; then
            die "version in apps/mobile/pubspec.yaml ist '$PUBSPEC_VERSION' - ohne +versionCode keine Monotoniepruefung."
          fi
          BASE_CODE="${PUBSPEC_VERSION#*+}"
          if [ -n "$PREV_CODE" ]; then
            echo "vorher ($PREV): versionCode $PREV_CODE - jetzt: $BASE_CODE (arm64/universal $ARM64_CODE)"
            if [ "$BASE_CODE" -le "$PREV_CODE" ]; then
              report "$GITHUB_REF_NAME hat Build-Nummer $BASE_CODE, $PREV hatte $PREV_CODE - Android bietet dann kein Update an. Bitte in apps/mobile/pubspec.yaml die Build-Nummer erhoehen (1.0.x+N)."
            fi
          fi
          if [ "$FAILED" = "1" ]; then
            if [ "$STRICT" = "1" ]; then
              exit 1
            fi
            echo "::notice::Preflight: die Abweichungen oben sind auf einem Branch nur Warnungen - bitte vor dem Taggen beheben."
            exit 0
          fi
          echo "Guard ok: versionName $EXPECTED, Build-Nummer $BASE_CODE (Vorgaenger ${PREV:-keiner})."

      # Beweist pro Lauf, dass wirklich der Release-Schlüssel signiert hat:
      # debug-signierte APKs wären für Nutzer nicht installierbar (Update).
      - name: Signatur aller Release-APKs prüfen
        if: steps.signing.outputs.signed == 'true'
        working-directory: apps/mobile
        env:
          EXPECTED_CERT: ${{ secrets.MOTOROUTE_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          # find statt ls: unabhaengig von Leerzeichen/Sonderzeichen im Pfad,
          # sort -V nimmt die hoechste Build-Tools-Version.
          APKSIGNER=$(find "$SDK/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n1)
          # Ohne apksigner wuerde die Schleife unten nur mit "command not found"
          # abbrechen - hier steht der eigentliche Grund.
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner nicht gefunden unter $SDK/build-tools - Signatur waere ungeprueft."
            exit 1
          fi
          # Sollwert normalisieren: keytool zeigt Fingerabdruecke mit Doppelpunkten.
          EXPECTED=$(printf '%s' "${EXPECTED_CERT:-}" | tr -d '[:space:]:' | tr 'A-F' 'a-f')
          # Ohne Sollwert ist der Vergleich wirkungslos - bei einem Tag also
          # lieber scheitern als still nichts zu pruefen.
          if [ -z "$EXPECTED" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::MOTOROUTE_SIGNING_CERT_SHA256 fehlt - ohne Sollwert prueft dieser Schritt nichts."
            exit 1
          fi
          if [ -n "$EXPECTED" ] && [ "${#EXPECTED}" -ne 64 ]; then
            echo "::error::MOTOROUTE_SIGNING_CERT_SHA256 ist kein SHA-256-Digest (${#EXPECTED} statt 64 Hex-Zeichen)."
            exit 1
          fi
          if [ -z "$EXPECTED" ]; then
            echo "::warning::MOTOROUTE_SIGNING_CERT_SHA256 fehlt - Digest wird nur angezeigt, nicht verglichen (kein Release-Tag)."
          fi
          # Jede veroeffentlichte APK einzeln: eine debug-signierte Variante
          # zwischen vier korrekten faellt sonst nicht auf.
          for APK in dist/*.apk; do
            CERTS=$("$APKSIGNER" verify --print-certs "$APK")
            if grep -q "CN=Android Debug" <<<"$CERTS"; then
              echo "::error::$APK ist debug-signiert - sie laesst sich nicht ueber eine bestehende Installation legen."
              exit 1
            fi
            DIGEST=$(grep -m1 "SHA-256 digest" <<<"$CERTS" | sed 's/.*digest: //' | tr 'A-F' 'a-f')
            if [ -n "$EXPECTED" ] && [ "$DIGEST" != "$EXPECTED" ]; then
              echo "::error::Signaturzertifikat von $APK weicht ab: erwartet $EXPECTED_CERT, gefunden $DIGEST."
              exit 1
            fi
            echo "$APK signiert mit $DIGEST"
          done

      # Diagnostik: Log-Tail in die Job-Summary — der ist öffentlich auf der
      # Run-Seite lesbar, ohne Admin-Token (Job-Logs-Download braucht Admin).
      - name: Build-Log (Tail) in Summary
        if: failure()
        working-directory: apps/mobile
        run: |
          {
            echo '### Release-APK Build-Fehler – letzte 200 Zeilen'
            echo '```'
            tail -n 200 build-release.log 2>/dev/null || echo '(kein Log vorhanden)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Artifact (7 Tage abrufbar)
        uses: actions/upload-artifact@v4
        with:
          name: motoroute-apk
          path: apps/mobile/dist/*.apk
          # Ohne retention-days gilt die Repo-Voreinstellung (90 Tage) -
          # der Name verspricht 7. Die APKs haengen dauerhaft am Release,
          # das Artifact ist nur fuer den Lauf selbst gedacht.
          retention-days: 7
          if-no-files-found: error

      # Release-Seite wie bisher: Titel „MotoRoute X.Y.Z", Universal-Asset
      # „MotoRoute-vX.Y.Z.apk“ (Konvention der Releases bis v1.0.3) - dazu je
      # ABI ein Asset mit Suffix, das nur ~40 MB gross ist.
      - name: APKs auf Releases-Namen kopieren
        id: assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME}"
          cp apps/mobile/dist/app-release.apk "MotoRoute-${V}.apk"
          for APK in apps/mobile/dist/app-*-release.apk; do
            ABI="${APK#apps/mobile/dist/app-}"
            cp "$APK" "MotoRoute-${V}-${ABI%-release.apk}.apk"
          done
          # Mapping gehoert zum Release: es ist der einzige Weg, spaetere
          # Stacktraces genau dieser APKs lesbar zu machen.
          cp apps/mobile/build/app/outputs/mapping/release/mapping.txt "MotoRoute-${V}-mapping.txt"
          # Titel-Konvention der alten Releases: "MotoRoute 1.0.4" (ohne v).
          echo "VERSION_NO_V=${V#v}" >> "$GITHUB_ENV"
          # SHA-256-Liste fuer den Release-Text. Die Namen kommen aus dem Glob,
          # es gibt keine zweite Asset-Liste im Workflow zu pflegen.
          bt='`'
          sums=()
          for APK in MotoRoute-*.apk; do
            SUM=$(sha256sum "$APK" | cut -d" " -f1)
            sums+=("- ${bt}${APK}${bt} - ${bt}${SUM}${bt}")
          done
          printf '%s\n' "${sums[@]}"
          {
            echo "sums<<EOF"
            printf '%s\n' "${sums[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2012 # Ausgabe fuer Menschen, kein Parsing
          ls -lh MotoRoute-*

      # Einmaliges Aufräumen: Das erste v1.0.4-Release hieß generisch
      # (app-release.apk) — der Restbestand wird entfernt, falls vorhanden.
      - name: Alt-Asset app-release.apk löschen (falls vorhanden)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/mobile
        run: gh release delete-asset "${{ github.ref_name }}" app-release.apk --yes || true

      - name: Release bei Tag-Push (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MotoRoute ${{ env.VERSION_NO_V }}
          files: |
            MotoRoute-${{ github.ref_name }}.apk
            MotoRoute-${{ github.ref_name }}-arm64-v8a.apk
            MotoRoute-${{ github.ref_name }}-armeabi-v7a.apk
            MotoRoute-${{ github.ref_name }}-x86_64.apk
            MotoRoute-${{ github.ref_name }}-mapping.txt
          # Steht über den automatisch generierten Commit-Notizen (die Action
          # stellt `body` voran) - sonst laedt weiter jeder die 110-MB-Datei.
          body: |
            ### Welche APK herunterladen?

            Für praktisch alle Geräte: **`MotoRoute-${{ github.ref_name }}-arm64-v8a.apk`** (~40 MB).

            `MotoRoute-${{ github.ref_name }}.apk` (~110 MB) ist die Universal-APK mit allen
            ABIs und nur der Fallback, falls die arm64-Variante nicht installiert werden kann.
            `-armeabi-v7a` ist für ältere 32-Bit-Geräte, `-x86_64` für Emulator/Chromebook.

            **Bitte bei der einmal gewählten Variante bleiben.** Die ABI-Pakete bekommen von
            Gradle einen Versions-Offset (+1000 armeabi-v7a, +2000 arm64, +4000 x86_64). Die
            Universal-APK trägt denselben versionCode wie das arm64-Paket, ein Wechsel zwischen
            diesen beiden klappt deshalb in beide Richtungen. Wer von `-armeabi-v7a` kommt, muss
            dagegen einmal deinstallieren.

            Zusätzlich liegt `MotoRoute-${{ github.ref_name }}-mapping.txt` bei: das R8-Mapping
            der Release-APKs. Nur für die Fehleranalyse - damit lassen sich Stacktraces aus
            genau diesen Builds wieder Klassennamen zuordnen.

            ### Prüfsummen (SHA-256)

            ${{ steps.assets.outputs.sums }}

            Vergleichen mit `sha256sum <datei>` (Linux/macOS) oder `certutil -hashfile <datei> SHA256` (Windows).

            ### Signatur prüfen

            `apksigner` liegt in den Android-SDK `build-tools`; im gleichen Ordner aufrufen:

            ```
            apksigner verify --print-certs MotoRoute-${{ github.ref_name }}-arm64-v8a.apk
            ```

            Erwartet wird `Signer #1 certificate SHA-256 digest: ${{ secrets.MOTOROUTE_SIGNING_CERT_SHA256 || 'siehe docs/10-dev-process.md' }}`.
            Weicht der Wert ab, stammt die Datei nicht aus diesem Release - dann nicht installieren.
          generate_release_notes: true

      # action-gh-release setzt den Titel bei bereits existierenden Releases
      # nicht um — der Konventionstitel wird deshalb explizit erzwungen.
      - name: Release-Titel auf Konvention bringen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --title "MotoRoute ${GITHUB_REF_NAME#v}"
