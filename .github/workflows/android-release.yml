name: Android Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Tag-Release braucht Schreibrecht auf Contents (v-Release erstellen/anhängen).
permissions:
  contents: write

jobs:
  test:
    name: Tests (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          # Feste Version: `channel: stable` haette bei jedem Lauf ein anderes
          # SDK gezogen - zusammen mit dem eingecheckten pubspec.lock baut
          # derselbe Commit dann wirklich dasselbe APK.
          flutter-version: '3.47.4'

      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        # Info-/Warning-Meldungen blockieren den Build nicht; echte Errors
        # führen weiterhin zu exit != 0 → Job fällt.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        working-directory: apps/mobile
        run: flutter test

  build-apk:
    name: Release-APKs (installierbar)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Java 21 (flutter_keychain 3.0.1 target)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'

      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get

      # Release-Signatur: Ohne echten Keystore bekommt jede APK den
      # Zufalls-Debug-Schlüssel des jeweiligen Runners - Updates über eine
      # bestehende Installation scheitern dann an der Signatur.
      - name: Signaturschlüssel bereitstellen
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.MOTOROUTE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOTOROUTE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOTOROUTE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOTOROUTE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::MOTOROUTE_KEYSTORE_B64 fehlt - ein Release waere nur debug-signiert und nicht update-faehig."
              exit 1
            fi
            echo "::warning::Kein Release-Keystore hinterlegt - dieser Build ist nur debug-signiert (kein Release-Tag)."
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/motoroute-release.jks"
          mkdir -p "$(dirname "$KEYSTORE")"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          # Früh und eindeutig scheitern, wenn Keystore, Passwort und Alias
          # nicht zusammenpassen - sonst bricht erst Gradle mit kryptischem
          # Fehler ab. Passwort über die Umgebung, nicht über argv.
          if ! PW="$KEYSTORE_PASSWORD" keytool -list -keystore "$KEYSTORE" -storepass:env PW -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::Keystore, Passwort oder Alias aus den Secrets passen nicht zusammen."
            exit 1
          fi
          {
            echo "MOTOROUTE_KEYSTORE_PATH=$KEYSTORE"
            echo "MOTOROUTE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MOTOROUTE_KEY_ALIAS=$KEY_ALIAS"
            echo "MOTOROUTE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APKs (release, signiert)
        working-directory: apps/mobile
        env:
          # Haupt-API (Login, Profile, Chat usw.) der wiederhergestellten App.
          # MOTOROUTE_API_BASE_URL bleibt separat für das neue Pairing-Backend.
          API_BASE_URL: https://motoroute-api-8fi9.onrender.com
          MOTOROUTE_API_BASE_URL: ${{ vars.MOTOROUTE_API_BASE_URL || 'https://motoroute.example' }}
        run: |
          set -o pipefail
          set -x
          rm -rf dist && mkdir -p dist
          # 1) Universal-APK (alle ABIs, ~110 MB) als Fallback.
          flutter build apk --release \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="MOTOROUTE_API_BASE_URL=$MOTOROUTE_API_BASE_URL" 2>&1 \
            | tee build-release.log
          cp build/app/outputs/flutter-apk/app-release.apk dist/
          # 2) Eine APK pro ABI (~40 MB): arm64 deckt aktuelle Geraete ab,
          #    armeabi-v7a aeltere, x86_64 Emulator/Chromebook.
          flutter build apk --release --split-per-abi \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="MOTOROUTE_API_BASE_URL=$MOTOROUTE_API_BASE_URL" 2>&1 \
            | tee -a build-release.log
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             build/app/outputs/flutter-apk/app-x86_64-release.apk dist/
          ls -lh dist

      - name: Produktions-API erreichbar
        if: success()
        env:
          API_BASE_URL: https://motoroute-api-8fi9.onrender.com
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 "$API_BASE_URL/v1/health"

      - name: APKs enthalten Produktions-API
        if: success()
        working-directory: apps/mobile
        run: |
          for APK in dist/*.apk; do
            strings "$APK" | grep -Fq 'https://motoroute-api-8fi9.onrender.com' || {
              echo "Release-APK $APK enthält nicht die erwartete Produktions-API-URL." >&2
              exit 1
            }
          done

      # Beweist pro Lauf, dass wirklich der Release-Schlüssel signiert hat:
      # debug-signierte APKs wären für Nutzer nicht installierbar (Update).
      - name: Signatur aller Release-APKs prüfen
        if: success() && steps.signing.outputs.signed == 'true'
        working-directory: apps/mobile
        env:
          EXPECTED_CERT: ${{ secrets.MOTOROUTE_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -n1)
          # Sollwert normalisieren: keytool zeigt Fingerabdruecke mit Doppelpunkten.
          EXPECTED=$(printf '%s' "${EXPECTED_CERT:-}" | tr -d '[:space:]:' | tr 'A-F' 'a-f')
          # Ohne Sollwert ist der Vergleich wirkungslos - bei einem Tag also
          # lieber scheitern als still nichts zu pruefen.
          if [ -z "$EXPECTED" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::MOTOROUTE_SIGNING_CERT_SHA256 fehlt - ohne Sollwert prueft dieser Schritt nichts."
            exit 1
          fi
          if [ -n "$EXPECTED" ] && [ "${#EXPECTED}" -ne 64 ]; then
            echo "::error::MOTOROUTE_SIGNING_CERT_SHA256 ist kein SHA-256-Digest (${#EXPECTED} statt 64 Hex-Zeichen)."
            exit 1
          fi
          if [ -z "$EXPECTED" ]; then
            echo "::warning::MOTOROUTE_SIGNING_CERT_SHA256 fehlt - Digest wird nur angezeigt, nicht verglichen (kein Release-Tag)."
          fi
          # Jede veroeffentlichte APK einzeln: eine debug-signierte Variante
          # zwischen vier korrekten faellt sonst nicht auf.
          for APK in dist/*.apk; do
            CERTS=$("$APKSIGNER" verify --print-certs "$APK")
            echo "$CERTS"
            if grep -q "CN=Android Debug" <<<"$CERTS"; then
              echo "::error::$APK ist debug-signiert - sie laesst sich nicht ueber eine bestehende Installation legen."
              exit 1
            fi
            DIGEST=$(grep -m1 "SHA-256 digest" <<<"$CERTS" | sed 's/.*digest: //' | tr 'A-F' 'a-f')
            if [ -n "$EXPECTED" ] && [ "$DIGEST" != "$EXPECTED" ]; then
              echo "::error::Signaturzertifikat von $APK weicht ab: erwartet $EXPECTED_CERT, gefunden $DIGEST."
              exit 1
            fi
            echo "$APK signiert mit $DIGEST"
          done

      # Diagnostik: Log-Tail in die Job-Summary — der ist öffentlich auf der
      # Run-Seite lesbar, ohne Admin-Token (Job-Logs-Download braucht Admin).
      - name: Build-Log (Tail) in Summary
        if: failure()
        working-directory: apps/mobile
        run: |
          {
            echo '### Release-APK Build-Fehler – letzte 200 Zeilen'
            echo '```'
            tail -n 200 build-release.log 2>/dev/null || echo '(kein Log vorhanden)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Artifact (7 Tage abrufbar)
        uses: actions/upload-artifact@v4
        with:
          name: motoroute-apk
          path: apps/mobile/dist/*.apk
          if-no-files-found: error

      # Release-Seite wie bisher: Titel „MotoRoute X.Y.Z", Universal-Asset
      # „MotoRoute-vX.Y.Z.apk“ (Konvention der Releases bis v1.0.3) - dazu je
      # ABI ein Asset mit Suffix, das nur ~40 MB gross ist.
      - name: APKs auf Releases-Namen kopieren
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME}"
          cp apps/mobile/dist/app-release.apk "MotoRoute-${V}.apk"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cp "apps/mobile/dist/app-${ABI}-release.apk" "MotoRoute-${V}-${ABI}.apk"
          done
          ls -lh MotoRoute-*.apk
          # Titel-Konvention der alten Releases: „MotoRoute 1.0.4" (ohne v).
          echo "VERSION_NO_V=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Einmaliges Aufräumen: Das erste v1.0.4-Release hieß generisch
      # (app-release.apk) — der Restbestand wird entfernt, falls vorhanden.
      - name: Alt-Asset app-release.apk löschen (falls vorhanden)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/mobile
        run: gh release delete-asset "${{ github.ref_name }}" app-release.apk --yes || true

      - name: Release bei Tag-Push (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MotoRoute ${{ env.VERSION_NO_V }}
          files: |
            MotoRoute-${{ github.ref_name }}.apk
            MotoRoute-${{ github.ref_name }}-arm64-v8a.apk
            MotoRoute-${{ github.ref_name }}-armeabi-v7a.apk
            MotoRoute-${{ github.ref_name }}-x86_64.apk
          generate_release_notes: true

      # action-gh-release setzt den Titel bei bereits existierenden Releases
      # nicht um — der Konventionstitel wird deshalb explizit erzwungen.
      - name: Release-Titel auf Konvention bringen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --title "MotoRoute ${GITHUB_REF_NAME#v}"
