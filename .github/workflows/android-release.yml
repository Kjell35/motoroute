name: Android Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Tag-Release braucht Schreibrecht auf Contents (v-Release erstellen/anhängen).
permissions:
  contents: write

jobs:
  test:
    name: Tests (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        # Info-/Warning-Meldungen blockieren den Build nicht; echte Errors
        # führen weiterhin zu exit != 0 → Job fällt.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        working-directory: apps/mobile
        run: flutter test

  build-apk:
    name: Release-APK (installierbar)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build APK (release, debug-signed)
        working-directory: apps/mobile
        env:
          MOTOROUTE_API_BASE_URL: ${{ vars.MOTOROUTE_API_BASE_URL || 'https://motoroute.example' }}
        run: |
          set -o pipefail
          set -x
          flutter build apk --release \
            --dart-define="MOTOROUTE_API_BASE_URL=$MOTOROUTE_API_BASE_URL" 2>&1 \
            | tee build-release.log

      # Diagnostik: Log-Tail in die Job-Summary — der ist öffentlich auf der
      # Run-Seite lesbar, ohne Admin-Token (Job-Logs-Download braucht Admin).
      - name: Build-Log (Tail) in Summary
        if: failure()
        working-directory: apps/mobile
        run: |
          {
            echo '### Release-APK Build-Fehler – letzte 200 Zeilen'
            echo '```'
            tail -n 200 build-release.log 2>/dev/null || echo '(kein Log vorhanden)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Artifact (7 Tage abrufbar)
        uses: actions/upload-artifact@v4
        with:
          name: motoroute-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Release-Seite wie bisher: Titel „MotoRoute X.Y.Z", Asset
      # „MotoRoute-vX.Y.Z.apk” (Konvention der Releases bis v1.0.3).
      - name: APK auf Releases-Namen kopieren
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk "MotoRoute-${{ github.ref_name }}.apk"
          # Titel-Konvention der alten Releases: „MotoRoute 1.0.4" (ohne v).
          echo "VERSION_NO_V=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Einmaliges Aufräumen: Das erste v1.0.4-Release hieß generisch
      # (app-release.apk) — der Restbestand wird entfernt, falls vorhanden.
      - name: Alt-Asset app-release.apk löschen (falls vorhanden)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/mobile
        run: gh release delete-asset "${{ github.ref_name }}" app-release.apk --yes || true

      - name: Release bei Tag-Push (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MotoRoute ${{ env.VERSION_NO_V }}
          files: MotoRoute-${{ github.ref_name }}.apk
          generate_release_notes: true

      # action-gh-release setzt den Titel bei bereits existierenden Releases
      # nicht um — der Konventionstitel wird deshalb explizit erzwungen.
      - name: Release-Titel auf Konvention bringen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --title "MotoRoute ${GITHUB_REF_NAME#v}"
