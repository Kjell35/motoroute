# Keep-Alive b: Zweiter Warmup-Ping mit VERSATZTEM Cron.
#
# GitHub drosselt Scheduled-Workflows massiv: statt alle 5 Minuten laufen
# sie real oft nur alle 3-9 Stunden. Ein einzelner Keep-Alive reicht dann
# nicht, um den Render-Free-Tier wachzuhalten (schlaeft nach ~15 min).
# Deshalb mehrere Workflows mit versetzten Minuten-Slots (1-59/5 statt
# 0-59/5) - wer von GitHub priorisiert wird, ist Zufall, deshalb
# mehrere Chancen pro Zeitschlitz.
#
# Identisch zu keep-alive.yml, aber:
#  - eigener concurrency group (kein Cancel des anderen Workflows)
#  - Cron-Slots bei Minute 1/6/11/16/... statt 0/5/10/15/...

name: keep-alive-b

on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch: {} # manueller Testlauf möglich

concurrency:
  group: keep-alive-b
  cancel-in-progress: false

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Backend aufwecken
        run: |
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 90 \
            https://motoroute-api-8fi9.onrender.com/v1/health || echo "000")
          echo "Health: HTTP $code"
          cat /tmp/health.json || true
          if [ "$code" != "200" ]; then
            echo "::warning::Backend antwortete nicht mit 200 (HTTP $code)"
          fi

      - name: Garage-API aufwecken
        run: |
          code=$(curl -s -o /tmp/garage-health.json -w "%{http_code}" --max-time 90 \
            https://garage-api-4a7o.onrender.com/api/health || echo "000")
          echo "Garage-Health: HTTP $code"
          cat /tmp/garage-health.json || true
          if [ "$code" != "200" ]; then
            echo "::warning::Garage-API antwortete nicht mit 200 (HTTP $code)"
          fi
