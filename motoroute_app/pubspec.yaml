name: motoroute_app
description: >
  MotoRoute - Navigations-App für Motorradfahrer mit fahrspaß-orientiertem
  Routing (kurvig/extra kurvig/schnell). Siehe /docs (Phase 1-3) im
  Repo-Root für Produktkontext.
publish_to: 'none'
version: 0.3.8+13

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management - chosen over Provider/Bloc for its compile-time
  # safety and straightforward testability of repository-backed
  # controllers, see Phase 1/2 Teil B.
  flutter_riverpod: ^2.5.1

  # MapLibre GL Native bindings - see Phase 1/2 Teil B.2 for why
  # MapLibre over Mapbox GL/Google Maps SDK (no vendor lock-in, full
  # style control for the custom dark map style from Phase 3 Teil B.6).
  maplibre_gl: ^0.22.0

  dio: ^5.7.0

  # Either<Failure, T> für Repository-Rückgabetypen - vermeidet, dass
  # Fehlerbehandlung in der UI-Schicht auf try/catch um Repository-
  # Aufrufe herum verstreut wird, siehe core/error/failure.dart.
  dartz: ^0.10.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  flutter_tts: ^4.2.0 # Sprachansagen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  battery_plus: ^7.1.1
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.5
  intl: any
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  image: ^4.10.1

flutter:
  uses-material-design: true
  assets:
    # Karten-Stile: Dark Matter (Vektor, 93 Layer - Primärstil) und
    # moto-route-dark (Raster-Fallback). Ohne Registrierung hier liefert
    # rootBundle.loadString einen Fehler -> leerer Stil = Blackscreen.
    - assets/styles/carto-dark-matter.json
    - assets/styles/carto-positron-gl-style.json
    - assets/styles/moto-route-dark.json

# Launcher-Icon aus tool/motoroute_icon.png (generiert durch
# tool/generate_icon.dart) in alle Android-Dichten rendern. Neuausführen
# nach Icon-Änderung:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "tool/motoroute_icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#14181C"
  adaptive_icon_foreground: "tool/motoroute_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
